<?xml version="1.0" encoding="UTF-8"?>
<!-- 隔离开关 电力SVG符号 固定黑色线条 -->
<svg xmlns="http://www.w3.org/2000/svg" width="641" height="512" viewBox="0 0 641 512">
  <!-- 水平进线 -->
  <line x1="0" y1="258" x2="168" y2="258" stroke="#000000" stroke-width="30" fill="none"/>
  <!-- 斜向刀闸 -->
  <line x1="160.5" y1="259" x2="432.5" y2="146" stroke="#000000" stroke-width="30" fill="none"/>
  <!-- 旋转竖线结构 -->
  <line transform="rotate(90 454.65 259.5)" x1="393.15" y1="259" x2="516.15" y2="260" stroke="#000000" stroke-width="30" fill="none"/>
  <!-- 水平出线 -->
  <line x1="469" y1="259" x2="641" y2="259" stroke="#000000" stroke-width="30" fill="none"/>
</svg>